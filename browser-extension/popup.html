<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Millie Task Autofill</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; width: 340px; padding: 12px; color: #1a1a1a; }
  h3 { margin: 0 0 10px 0; font-size: 14px; }
  .row { margin-bottom: 10px; }
  button { width: 100%; padding: 7px; font-size: 13px; cursor: pointer; }
  #fillBtn { background: #2563eb; color: white; border: none; border-radius: 4px; }
  #fillBtn:disabled { background: #93b4f0; cursor: not-allowed; }
  #status { font-size: 12px; color: #555; margin: 6px 0; min-height: 16px; }
  #log { width: 100%; height: 160px; font-family: Consolas, monospace; font-size: 10px; box-sizing: border-box; }
  .hint { font-size: 11px; color: #777; margin-top: 6px; }
</style>
</head>
<body>
  <h3>Millie Task Autofill</h3>
  <div class="row">
    <input type="file" id="fileInput" accept="application/json">
  </div>
  <div class="row">
    <button id="fillBtn" disabled>Fill this page</button>
  </div>
  <div id="status">Choose a JSON data file to begin.</div>
  <textarea id="log" readonly placeholder="Fill log will appear here after you click Fill this page."></textarea>
  <div class="hint">Navigate to each sub-page (task workspace, /facts, /reference, /rubric) and click Fill this page on each one. Review every field before clicking Save draft yourself; this tool never saves for you.</div>
  <script src="popup.js"></script>
</body>
</html>
